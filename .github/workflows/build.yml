name: Build Excel2GuanLiDe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/Excel2GuanLiDe/Excel2GuanLiDe.csproj
      - name: Build
        run: dotnet build src/Excel2GuanLiDe/Excel2GuanLiDe.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish src/Excel2GuanLiDe/Excel2GuanLiDe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Excel2GuanLiDe-win-x64
          path: publish/
