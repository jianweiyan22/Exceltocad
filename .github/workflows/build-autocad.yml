name: Build AutoCAD 2018 Plugin

on:
  push:
    paths:
      - 'src/AutoCAD2018/**'
      - '.github/workflows/build-autocad.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore
        run: dotnet restore src/AutoCAD2018/Excel2GuanLiDe.csproj
      - name: Build
        run: dotnet build src/AutoCAD2018/Excel2GuanLiDe.csproj -c Release --no-restore
      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item src/AutoCAD2018/bin/Release/Excel2GuanLiDe.dll package/Excel2GuanLiDe.dll
          Copy-Item src/AutoCAD2018/README.md package/README.md
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Excel2GuanLiDe-AutoCAD2018
          path: package/
